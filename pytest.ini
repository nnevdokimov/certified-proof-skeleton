[pytest]
# Explicit files also keep preserved, untracked research tests out of discovery.
testpaths =
    tests/test_compression_overlay.py
    tests/test_deferred_queue.py
    tests/test_metamath_native.py
    tests/test_native_cumulative_policy.py
    tests/test_native_holdout.py
    tests/test_native_quality_evaluation.py
    tests/test_native_rule_synthesis.py
python_files = test_*.py
addopts = -m "not integration"
markers =
    integration: requires original pinned data, trained model, or external verifier; may generate proofs
